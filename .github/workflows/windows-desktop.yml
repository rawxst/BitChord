name: Build BitChord for Windows

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to stamp into the Windows build (without v)"
        required: true
        default: "1.8.1"

permissions:
  contents: read

jobs:
  windows:
    name: Windows installer and portable build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin

      - uses: gradle/actions/setup-gradle@v4

      - name: Install WiX Toolset 3
        shell: pwsh
        run: |
          $url = "https://github.com/wixtoolset/wix3/releases/download/wix3141rtm/wix314-binaries.zip"
          Invoke-WebRequest -Uri $url -OutFile wix.zip
          Expand-Archive wix.zip -DestinationPath "$env:RUNNER_TEMP\wix"
          "$env:RUNNER_TEMP\wix" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Run desktop tests
        shell: pwsh
        run: .\gradlew.bat :shared:jvmTest :desktopUi:jvmTest :desktopApp:test "-Pbitchord.version=${{ inputs.version }}"

      - name: Build Windows installer, MSI and app image
        shell: pwsh
        run: .\gradlew.bat :desktopApp:packageMsi :desktopApp:packageExe :desktopApp:createDistributable "-Pbitchord.version=${{ inputs.version }}"

      - name: Verify bundled application
        shell: pwsh
        run: |
          $jar = Get-ChildItem desktopApp/build/compose/binaries/main/app/BitChord/app/desktopApp*.jar | Select-Object -First 1
          if (-not $jar) { throw "Desktop application JAR was not produced" }
          jar tf $jar.FullName | Select-String -Pattern 'models/.*\.onnx' -Quiet
          if ($LASTEXITCODE -ne 0) { throw "ONNX models not found in app JAR" }

      - name: Collect Windows artifacts
        shell: pwsh
        run: |
          $v = "${{ inputs.version }}"
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item desktopApp/build/compose/binaries/main/msi/*.msi "dist/BitChord-$v-windows-x64.msi"
          Copy-Item desktopApp/build/compose/binaries/main/exe/*.exe "dist/BitChord-$v-windows-x64-setup.exe"
          7z a -tzip -mx=5 "dist/BitChord-$v-windows-x64-portable.zip" `
            "desktopApp/build/compose/binaries/main/app/BitChord/*" | Out-Null
          Get-ChildItem dist | Format-Table Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: BitChord-Windows-${{ inputs.version }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
